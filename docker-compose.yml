version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wuzen_postgres
    environment:
      POSTGRES_USER: wuzen
      POSTGRES_PASSWORD: ${DB_PASS:-wuzen_secret_2026}
      POSTGRES_DB: wuzen_c2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - wuzen_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuzen -d wuzen_c2"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wuzen_redis
    command: redis-server --requirepass ${REDIS_PASS:-wuzen_redis_2026}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - wuzen_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: wuzen_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-wuzen_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-wuzen_minio_secret_2026}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - wuzen_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: wuzen_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wuzen
      DB_PASS: ${DB_PASS:-wuzen_secret_2026}
      DB_NAME: wuzen_c2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS:-wuzen_redis_2026}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-wuzen_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-wuzen_minio_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-wuzen_jwt_super_secret_2026_change_in_prod}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-wuzen_aes_256_gcm_key_32bytes!!}
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: 1883
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./shared:/app/shared
      - backend_logs:/app/logs
    networks:
      - wuzen_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: wuzen_mqtt
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9002:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks:
      - wuzen_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: wuzen_frontend
    ports:
      - "80:80"
    networks:
      - wuzen_net
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: wuzen_nginx
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - wuzen_net
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mqtt_data:
  mqtt_logs:
  backend_logs:

networks:
  wuzen_net:
    driver: bridge
